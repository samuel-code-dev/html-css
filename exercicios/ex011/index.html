<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mídias em HTML5</title>
</head>

<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumenta e diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 700px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">

        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo Áudios</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5.</p>
   <audio preload="metadata" autoplay controls loop>
    <source src="midias/Once In A While I Dream - Tama Shutts.mp3" type="audio/mpeg">
    <source src="midias/Once In A While I Dream - Tama Shutts.ogg" type="audio/ogg">
    <source src="midias/Once In A While I Dream - Tama Shutts.wav" type="audio/wav">
    <p>Infezlimente seu navegador não consegue reproduzir o áudio. <a href="midias/Once In A While I Dream - Tama Shutts.mp3"></a></p>
   </audio>
</html>
</body>
